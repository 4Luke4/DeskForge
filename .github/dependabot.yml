version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    labels: [dependencies, area/android]
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: [minor, patch]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin.*", "com.android.*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Rome
    labels: [dependencies, area/ci]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 10

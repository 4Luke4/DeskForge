name: ARM64 emulator QA

on:
  # Emulator QA is intentionally operator-triggered because each ARM64 system
  # image is expensive to provision and software emulation is time-intensive.
  # The job-level ref guard prevents these resources from being used by an
  # unreviewed branch selected in GitHub's workflow-dispatch interface.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-main
  cancel-in-progress: true

jobs:
  tablet:
    name: API ${{ matrix.api-level }} tablet
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Google currently publishes stable google_apis ARM64 images through API 36.
        api-level: [34, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm ARM64 host
        run: test "$(uname -m)" = "arm64"

      - name: Export pinned Android toolchain
        id: toolchain
        uses: ./.github/actions/export-android-toolchain

      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android build toolchain
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${ANDROID_CMAKE}"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Exercise the tablet interface and capture evidence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ steps.toolchain.outputs.android_abi }}
          target: google_apis
          profile: pixel_tablet
          # GitHub's ARM64 macOS hosts do not expose nested virtualization, so
          # QEMU must use its documented software-acceleration fallback.
          emulator-options: -no-window -accel off -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            mkdir -p build/qa
            adb logcat -c
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            adb shell am force-stop com.deskforge.app.debug
            adb shell monkey -p com.deskforge.app.debug -c android.intent.category.LAUNCHER 1
            adb shell uiautomator dump /sdcard/deskforge-window.xml
            adb pull /sdcard/deskforge-window.xml "build/qa/window-api-${{ matrix.api-level }}.xml"
            adb exec-out screencap -p > "build/qa/screenshot-api-${{ matrix.api-level }}.png"
            adb logcat -d -v threadtime > "build/qa/logcat-api-${{ matrix.api-level }}.txt"

      - name: Retain emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-evidence-api-${{ matrix.api-level }}
          path: |
            build/qa/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14

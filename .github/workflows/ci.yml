name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate version and localized resources
        run: |
          scripts/validate-version.sh
          scripts/validate-localizations.sh
          test "$(sed -n 's/^compileSdk=//p' config/android/toolchain.properties)" = \
            "$(sed -n 's/^targetSdk=//p' config/android/toolchain.properties)"

      - name: Validate pinned component manifests
        run: |
          jq -e '.version and .sourceUrl and (.sha256 | test("^[a-f0-9]{64}$"))' config/proot/version.json
          jq -e '.release and .imageUrl and (.sha256 | test("^[a-f0-9]{64}$")) and (.sizeBytes > 0)' config/distros/fedora-xfce-44.json

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/validate-conventional-commits.sh "$BASE_SHA" "$HEAD_SHA"

  android:
    name: Android verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export pinned Android toolchain
        run: scripts/export-android-toolchain.sh

      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android toolchain
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run static analysis, tests, and builds
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug bundleRelease

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Retain unsigned verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-verification-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate version and localized resources
        run: |
          scripts/validate-version.sh
          scripts/validate-localizations.sh
          test "$(sed -n 's/^compileSdk=//p' config/android/toolchain.properties)" = \
            "$(sed -n 's/^targetSdk=//p' config/android/toolchain.properties)"

      - name: Validate pinned component manifests
        run: |
          jq -e '
            .schemaVersion == 2 and
            .proot.version and .proot.sourceUrl and (.proot.sha256 | test("^[a-f0-9]{64}$")) and
            .buildDependencies.talloc.version and .buildDependencies.talloc.sourceUrl and
            (.buildDependencies.talloc.sha256 | test("^[a-f0-9]{64}$")) and
            .binary.abi == "arm64-v8a" and .binary.minimumApi == 34 and
            .binary.runtime.fileName == "libproot.so" and
            (.binary.runtime.sha256 | test("^[a-f0-9]{64}$")) and
            (.binary.runtime.sizeBytes >= 0) and
            .binary.loader.fileName == "libproot-loader.so" and
            (.binary.loader.sha256 | test("^[a-f0-9]{64}$")) and
            (.binary.loader.sizeBytes >= 0)
          ' config/proot/version.json
          jq -e '
            .schemaVersion == 2 and .release and .imageUrl and
            (.sha256 | test("^[a-f0-9]{64}$")) and (.sizeBytes > 0) and
            .desktopHost.version and .desktopHost.executable == "/usr/bin/Xvnc" and
            (.desktopHost.packages | length) > 0 and
            all(.desktopHost.packages[];
              .url and (.sha256 | test("^[a-f0-9]{64}$")) and (.sizeBytes > 0)) and
            (.desktopHost.source.sha256 | test("^[a-f0-9]{64}$")) and
            .assetDelivery.packNames == [
              "fedora_xfce_44", "fedora_xfce_44_1", "fedora_xfce_44_2", "fedora_xfce_44_3"
            ] and
            (.assetDelivery.packNames | length) == .assetDelivery.maximumParts and
            .assetDelivery.partSizeBytes < 1500000000 and
            .assetDelivery.maximumArchiveSizeBytes == 4000000000
          ' config/distros/fedora-xfce-44.json

      - name: Test bounded RFB protocol primitives
        run: bash scripts/test-rfb-protocol.sh

      - name: Validate pull request commits
        # Authenticated PR authorship cannot be spoofed through commit metadata.
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.user.login != 'dependabot[bot]' ||
          github.event.pull_request.user.type != 'Bot')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/validate-conventional-commits.sh "$BASE_SHA" "$HEAD_SHA"

  android:
    name: Android verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export pinned Android toolchain
        id: toolchain
        uses: ./.github/actions/export-android-toolchain

      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android toolchain
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify secured build dependency graph
        # The audit resolves every project configuration from its owning task and is intentionally
        # isolated from the build's configuration-cache and parallel-execution defaults.
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --no-parallel --stacktrace
          verifySecureBuildDependencies

      - name: Capture build dependency environments
        run: |
          ./gradlew --no-daemon --stacktrace \
            buildEnvironment \
            :app:buildEnvironment \
            :fedora_xfce_44:buildEnvironment \
            :fedora_xfce_44_1:buildEnvironment \
            :fedora_xfce_44_2:buildEnvironment \
            :fedora_xfce_44_3:buildEnvironment \
            > build-environment.txt

      - name: Run static analysis, tests, and builds
        run: >-
          ./gradlew --no-daemon --stacktrace
          lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest bundleRelease

      - name: Verify packaged PRoot executable
        run: >-
          scripts/verify-packaged-proot.sh
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/release/*.aab

      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            build-environment.txt
            app/build/reports/
            app/build/outputs/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Retain unsigned verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-verification-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  proot-runtime:
    name: Reproducible PRoot runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export pinned Android toolchain
        id: toolchain
        uses: ./.github/actions/export-android-toolchain

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;${ANDROID_NDK}"

      - name: Build independent PRoot copies
        run: |
          scripts/build-proot-android.sh \
            build/proot/first/libproot.so build/proot/first/libproot-loader.so build/proot/first/work
          scripts/build-proot-android.sh \
            build/proot/second/libproot.so build/proot/second/libproot-loader.so build/proot/second/work
          cmp build/proot/first/libproot.so build/proot/second/libproot.so
          cmp build/proot/first/libproot-loader.so build/proot/second/libproot-loader.so

      - name: Validate candidate and corresponding source
        run: |
          scripts/verify-proot-binary.sh \
            build/proot/first/libproot.so build/proot/first/libproot-loader.so --allow-unpinned
          scripts/package-proot-source.sh build/proot/deskforge-proot-corresponding-source.tar.gz

      - name: Compare committed runtime
        id: committed
        continue-on-error: true
        run: |
          scripts/verify-proot-binary.sh \
            app/src/main/jniLibs/arm64-v8a/libproot.so \
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          cmp app/src/main/jniLibs/arm64-v8a/libproot.so build/proot/first/libproot.so
          cmp \
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so \
            build/proot/first/libproot-loader.so

      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-proot-runtime
          path: |
            build/proot/first/libproot.so
            build/proot/first/libproot.so.sha256
            build/proot/first/libproot.so.size
            build/proot/first/libproot-loader.so
            build/proot/first/libproot-loader.so.sha256
            build/proot/first/libproot-loader.so.size
            build/proot/deskforge-proot-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Enforce committed runtime match
        if: steps.committed.outcome != 'success'
        run: |
          echo "The committed PRoot binary and manifest do not match the reproducible build" >&2
          exit 1

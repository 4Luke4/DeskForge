name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (for example v0.1.0)
        required: true
        type: string
      fedora_asset_run_id:
        description: Successful Prepare Fedora asset workflow run for the tagged commit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          git tag --verify "$RELEASE_TAG"

      - name: Restore verified Fedora asset payload
        env:
          FEDORA_ASSET_RUN_ID: ${{ inputs.fedora_asset_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FEDORA_ASSET_RUN_ID}" | \
            jq --exit-status --arg expected_sha "$(git rev-parse HEAD)" '
              .head_sha == $expected_sha and
              .conclusion == "success" and
              .path == ".github/workflows/fedora-asset.yml"
            '
          gh run download "$FEDORA_ASSET_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name fedora-xfce-44-asset \
            --dir .

      - name: Export pinned Android toolchain
        id: toolchain
        uses: ./.github/actions/export-android-toolchain

      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${ANDROID_CMAKE}"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify release prerequisites
        run: |
          scripts/verify-fedora-payload.sh
          test -x app/src/main/jniLibs/arm64-v8a/libproot.so
          test -x app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          scripts/verify-proot-binary.sh \
            app/src/main/jniLibs/arm64-v8a/libproot.so \
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so

      - name: Prepare corresponding source
        run: |
          scripts/package-proot-source.sh build/deskforge-proot-corresponding-source.tar.gz
          source_size="$(jq -r '.desktopHost.source.sizeBytes' config/distros/fedora-xfce-44.json)"
          source_sha256="$(jq -r '.desktopHost.source.sha256' config/distros/fedora-xfce-44.json)"
          source_path=build/fedora-corresponding-source/tigervnc.src.rpm
          test "$(stat --format='%s' "$source_path")" = "$source_size"
          echo "$source_sha256  $source_path" | sha256sum --check --strict
          cp "$source_path" build/tigervnc.src.rpm

      - name: Materialize ephemeral signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deskforge-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/deskforge-release.jks"
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
          } > signing.properties

      - name: Build signed bundle
        # The runner is clean; a Gradle clean here would delete the verified source artifacts above.
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Attest release bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app/build/outputs/bundle/release/*.aab
            build/deskforge-proot-corresponding-source.tar.gz
            build/tigervnc.src.rpm

      - name: Retain release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskforge-${{ inputs.tag }}-release-candidate
          path: |
            app/build/outputs/bundle/release/*.aab
            build/deskforge-proot-corresponding-source.tar.gz
            build/tigervnc.src.rpm
          if-no-files-found: error
          retention-days: 30

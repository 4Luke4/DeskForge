name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, cpp]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export pinned Android toolchain
        id: toolchain
        uses: ./.github/actions/export-android-toolchain

      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android toolchain
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${ANDROID_CMAKE}"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Compile analyzed sources
        # CodeQL 2.26.4 supports Kotlin below 2.4.20. This isolated, cache-free analysis build keeps
        # KAPT forbidden while normal CI and dependency submission verify the patched KGP graph.
        if: matrix.language == 'java-kotlin'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/codeql-gradle-home
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --stacktrace
          -Pdeskforge.codeqlKotlinCompatibility=true assembleDebug

      - name: Compile analyzed sources
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install --yes meson ninja-build pkg-config
          scripts/build-graphics-runtime-android.sh \
            app/src/main/jniLibs/arm64-v8a/libdeskforge_graphics.so \
            build/codeql-graphics/work
          scripts/verify-graphics-runtime.sh \
            app/src/main/jniLibs/arm64-v8a/libdeskforge_graphics.so
          scripts/build-proot-android.sh \
            build/codeql-proot/libproot.so \
            build/codeql-proot/libproot-loader.so \
            build/codeql-proot/work
          scripts/verify-proot-binary.sh \
            build/codeql-proot/libproot.so build/codeql-proot/libproot-loader.so --allow-unpinned
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create SBOM output directory
        run: mkdir -p build
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: deskforge-sbom.spdx.json
          output-file: build/deskforge-sbom.spdx.json
          syft-version: v1.51.1
          upload-artifact-retention: 14
